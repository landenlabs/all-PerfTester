import com.android.build.api.variant.ResValue

// All-PerfTester
plugins {
    id ("com.android.application")
}

android {

    compileSdk = 36
    namespace = "com.landenlabs.allperfimages"

    defaultConfig {
        applicationId = "com.landenlabs.allperfimages"
        minSdk = 23
        targetSdk = 36

        versionCode = 20630
        versionName = "2.06.30"

        // Limit languages to following list.
        resourceConfigurations += ['en', 'es']

        buildConfigField "long", "BuildTimeMilli", System.currentTimeMillis() + "L"

        resValue "string", "targetSdkVersion", targetSdkVersion.apiString
        resValue "string", "compileSdkVersion", compileSdkVersion
        resValue "string", "buildToolsVersion", buildToolsVersion
        // resValue "string", "javaVersion", Jvm.current().javaVersion.toString()
    }

    signingConfigs {
        release
    }

    // Load signing config (does not work for command line builds)
    // println("Setting release=${rootDir}/release.properties")
    if (file("${rootDir}/release.properties").exists()) {
        def props = new Properties()
        props.load(new FileInputStream(file("${rootDir}/release.properties")))
        android.signingConfigs.release.storeFile = file(props.keyStore)
        android.signingConfigs.release.storePassword = props.keyStorePassword
        android.signingConfigs.release.keyAlias = props.keyAlias
        android.signingConfigs.release.keyPassword = props.keyAliasPassword
        println("Setting release to " + signingConfigs.release.storeFile.absolutePath )
    }

    buildFeatures.buildConfig = true
    buildFeatures.resValues = true

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }

    lint {
        abortOnError false
        disable 'DefaultLocale', 'SimpleDateFormat', 'InflateParams', 'SpUsage',
                'UseCompoundDrawables', 'HandlerLeak', 'ViewConstructor', 'SetTextI18n',
                'RtlSymmetry', 'RtlHardcoded', 'ContentDescription',
                'MissingTranslation', 'ValidFragment', 'UnusedAttribute',
                'FieldCanBeLocal', 'LocalSuppress', 'HardcodedText', 'Typos'
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).tap {
            configureEach {
                // Enable verbose lint reporting during build.
                options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'

    // https://developers.google.com/android/guides/releases
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
}

// Rename app
androidComponents {
    onVariants(selector().all()) { variant ->
        // Save app version in string so resource can be used in layouts
        // (order matches original: "v"+versionName then overwritten by "version "+versionName)
        variant.resValues.put(
                variant.makeResValueKey("string", "versionName"),
                new ResValue("v" + variant.outputs[0].versionName.get(), null)
        )
        variant.resValues.put(
                variant.makeResValueKey("string", "versionName"),
                new ResValue("version " + variant.outputs[0].versionName.get(), null)
        )

        def ourName = project.parent.name
        variant.outputs.forEach { output ->
            def newName = "${ourName}-${variant.name}-${output.versionName.get()}.apk"
            output.outputFileName.set(newName)
            println "out name= $newName"
        }
    }
}